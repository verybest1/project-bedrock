apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carts
  template:
    metadata:
      labels:
        app: carts
    spec:
      containers:
      - name: carts
        image: public.ecr.aws/aws-containers/retail-store-sample-carts:0.3.0
        env:
        - name: CARTS_DYNAMODB_TABLENAME
          value: "bedrock-carts"
        - name: AWS_REGION
          value: "us-east-1"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: carts
  namespace: retail-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: carts